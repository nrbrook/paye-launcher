name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME_WORK: ${{ github.workspace }}/../runtime-build

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: brew install swiftlint ruff shellcheck actionlint
      - name: Lint
        run: make lint

  unit-tests:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  installer:
    name: Install from GOV.UK (network test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download, check and install Basic PAYE Tools into a temporary folder
        run: PAYE_LAUNCHER_NETWORK_TESTS=1 swift test --filter downloadsChecksAndInstallsFromGovUK

  runtime:
    name: Build universal runtime
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta 2 (for the x86_64 half)
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.RUNTIME_WORK }}/downloads
          key: runtime-downloads-${{ hashFiles('runtime/sources.sh') }}
      - name: Build
        run: WORK="$RUNTIME_WORK" runtime/build_runtime.sh
      - name: Pack (keeps file permissions)
        run: tar -C "$RUNTIME_WORK" -czf runtime.tar.gz runtime
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime
          path: runtime.tar.gz
          retention-days: 7
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build-logs
          path: ${{ env.RUNTIME_WORK }}/*/logs

  compare:
    name: Compare with HMRC's server (${{ matrix.arch }})
    needs: runtime
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]  # x86_64 runs in Rosetta, as on an Intel Mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: native-runtime
      - name: Unpack runtime
        run: mkdir -p "$RUNTIME_WORK" && tar -C "$RUNTIME_WORK" -xzf runtime.tar.gz
      - name: Install Rosetta 2 (HMRC's server is Intel only)
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Install Basic PAYE Tools from GOV.UK
        run: scripts/fetch_bpt.sh
      - name: Compare
        run: OUT="$RUNNER_TEMP/comparison" RUNTIME_ARCH="${{ matrix.arch }}" runtime/tests/run_comparison.sh "$RUNTIME_WORK/runtime"
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-results-${{ matrix.arch }}
          path: ${{ runner.temp }}/comparison

  package:
    name: Package (ad-hoc signed)
    needs: [runtime, unit-tests]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: native-runtime
      - name: Unpack runtime
        run: mkdir -p "$RUNTIME_WORK" && tar -C "$RUNTIME_WORK" -xzf runtime.tar.gz
      - name: Package
        run: scripts/package_app.sh --runtime "$RUNTIME_WORK/runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-unsigned
          path: dist/*.dmg*
          retention-days: 14
